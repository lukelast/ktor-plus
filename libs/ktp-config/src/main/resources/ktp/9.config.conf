app {
  name = ""
  nameShort = ""
  version = "local"
  // Set by the Kubernetes deployment; K_REVISION is provided by Cloud Run.
  version = ${?KUBE_APP_VERSION}
  version = ${?K_REVISION}
  // App-wide secret for encryption.
  secret = ""
  hostname = "unknown"
  hostname = ${?USER}
  hostname = ${?USERNAME}
  hostname = ${?HOSTNAME}
  server {
    port = 8080
    host = "0.0.0.0"
  }
}
