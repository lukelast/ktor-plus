securityHeaders {
  # Kill switch for every header the SecurityHeadersPlugin sets.
  enabled = true
  csp {
    # Report-Only logs violations without blocking; flip to false per env once the logs are clean.
    # Browsers POST violations to /csp-report, logged at WARN as "CSP violation report".
    reportOnly = true
    # Extra origins per fetch directive. Every directive already allows 'self'; style-src also
    # allows 'unsafe-inline' because React and UI libraries inject styles. Scripts must be
    # same-origin files or come from a listed origin: no inline <script> or onclick= handlers.
    # KTP plugins add their own origins in code (FirebaseAuthPlugin adds the Firebase Auth hosts
    # and the sign-in providers' avatar hosts for photoURL);
    # HOCON lists replace rather than merge, so an app that overrides one of these must repeat any
    # default it still wants.
    scriptSrc = []
    styleSrc = ["https://fonts.googleapis.com"]
    fontSrc = ["https://fonts.gstatic.com", "data:"]
    imgSrc = ["data:"]
    connectSrc = []
    frameSrc = []
  }
}
