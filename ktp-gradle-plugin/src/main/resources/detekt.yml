style:
  WildcardImport:
    # Intellij is dead set on wildcard imports by default.
    active: false
  ThrowsCount:
    # Default: 2
    max: 4
  ReturnCount:
    # Default: 2
    max: 4

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  MatchingDeclarationName:
    active: true

complexity:
  ComplexCondition:
    # Default: 3
    allowedConditions: 6
  CyclomaticComplexMethod:
    # Default: 14
    allowedComplexity: 25
  LongMethod:
    # Default: 60
    allowedLines: 100
  TooManyFunctions:
    # Default: 11
    allowedFunctionsPerFile: 20
    # Default: 11
    allowedFunctionsPerClass: 20
    # Default: 11
    allowedFunctionsPerInterface: 20
    # Default: 11
    allowedFunctionsPerObject: 20
    # Default: 11
    allowedFunctionsPerEnum: 20
