[versions]
kotlin = "2.4.10"
koin = "4.2.2"
koinPlugin = "1.1.0"
ktor = "3.5.2"
ktorPlugin = "3.5.2"
versionCheck = "0.61.0"
typesafeConfig = "1.4.9"
config4k = "0.7.0"
classgraph = "4.8.194"
slf4j = "2.0.19"
mockk = "1.14.11"
byteBuddy = "1.18.13"
stripe = "33.4.1"
kotest = "6.2.4"
gcpBom = "26.88.0"
detekt = "2.0.0-alpha.6"
ktfmt = "0.64"

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
versionCheck = { id = "io.github.ben-manes.versions", version.ref = "versionCheck" }

[libraries]
# Gradle Plugins
gradleKotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradleKtor = { module = "io.ktor.plugin:plugin", version.ref = "ktorPlugin" }
gradleKotlinSerialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
gradleKtfmt = { module = "com.ncorti.ktfmt.gradle:plugin", version = "0.27.0" }
gradleShadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version = "9.6.1" }
gradleDetekt = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradleKoinCompiler = { module = "io.insert-koin.compiler.plugin:io.insert-koin.compiler.plugin.gradle.plugin", version.ref = "koinPlugin" }
# Toolchain resolver so consumers can auto-download a missing JDK.
gradleFoojay = { module = "org.gradle.toolchains:foojay-resolver", version = "1.0.0" }

# Testing
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotest-bom = { module = "io.kotest:kotest-bom", version.ref = "kotest" }
kotest-engine = { module = "io.kotest:kotest-framework-engine"}
kotest-koin = { module = "io.kotest:kotest-extensions-koin" }

# Caching https://github.com/ben-manes/caffeine
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version = "3.2.4" }

# Kotlin
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }

# Ktor
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-core = { module = "io.ktor:ktor-server-core" }
ktor-netty = { module = "io.ktor:ktor-server-netty-jvm" }
ktor-serializationJson = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-callLogging = { module = "io.ktor:ktor-server-call-logging" }
ktor-statusPages = { module = "io.ktor:ktor-server-status-pages" }
ktor-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-compression = { module = "io.ktor:ktor-server-compression" }
ktor-forwardedHeader = { module = "io.ktor:ktor-server-forwarded-header" }
ktor-cachingHeaders = { module = "io.ktor:ktor-server-caching-headers" }
ktor-conditionalHeaders = { module = "io.ktor:ktor-server-conditional-headers" }
ktor-hsts = { module = "io.ktor:ktor-server-hsts" }
ktor-resources = { module = "io.ktor:ktor-server-resources" }
ktor-sessions = { module = "io.ktor:ktor-server-sessions" }
ktor-auth = { module = "io.ktor:ktor-server-auth" }
ktor-test = { module = "io.ktor:ktor-server-test-host" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-java = { module = "io.ktor:ktor-client-java" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation" }

# Config dependencies
typesafeConfig = { module = "com.typesafe:config", version.ref = "typesafeConfig" }
config4k = { module = "io.github.config4k:config4k", version.ref = "config4k" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }

## Koin dependencies
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-annotations = { module = "io.insert-koin:koin-annotations" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }
koin-logger-slf4j = { module = "io.insert-koin:koin-logger-slf4j" }
koin-test = { module = "io.insert-koin:koin-test" }

# Stripe dependencies
stripe = { module = "com.stripe:stripe-java", version.ref = "stripe" }

# Google Cloud Platform dependencies
# Google Cloud BOM for version management: https://cloud.google.com/java/docs/bom
gcp-bom = { module = "com.google.cloud:libraries-bom", version.ref = "gcpBom" }
gcp-core = { module = "com.google.cloud:google-cloud-core" }
gcp-firestore = { module = "com.google.cloud:google-cloud-firestore" }
# Firebase Admin SDK - manages its own version but uses GCP BOM for transitive deps
firebaseAdmin = { module = "com.google.firebase:firebase-admin", version = "9.10.0" }
# Identity Platform Admin API. Stay on v2: Maven Central's <latest> is a 2018 legacy v3 artifact
# that the versionCheck task's isNonStable filter does not reject - do not "upgrade" to it.
identityToolkit = { module = "com.google.apis:google-api-services-identitytoolkit", version = "v2-rev20250130-2.0.0" }

# Logging dependencies
logbackClassic = { module = "ch.qos.logback:logback-classic", version = "1.6.3" }
logstashLogbackEncoder = { module = "net.logstash.logback:logstash-logback-encoder", version = "9.0" }
kotlinLogging = { module = "io.github.oshai:kotlin-logging-jvm", version = "8.0.4" }
slf4jJcl = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slf4j" }
slf4jJul = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }
