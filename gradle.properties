# The daemon defaults (512m heap, 384m Metaspace) are too small for this build: plugin-jar
# churn during snapshot development fills Metaspace with reloaded classes and kills the daemon.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true